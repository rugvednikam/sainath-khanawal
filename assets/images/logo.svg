<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <!-- Circular Traditional Emblem -->
  <g transform="translate(10, 8)">
    <!-- Outer Decorative Ring -->
    <circle cx="32" cy="32" r="30" fill="#9E2A2B" stroke="#C97A2B" stroke-width="2.5"/>
    <circle cx="32" cy="32" r="26" fill="#7A1F20" stroke="#FAF7F2" stroke-width="0.8" stroke-dasharray="2 2"/>
    
    <!-- Traditional Brass Thali & Vati Motif -->
    <!-- Center Traditional Flame / Tup Diya -->
    <path d="M32 16 C34 22, 38 25, 38 31 C38 35.4 35.3 38 32 38 C28.7 38, 26 35.4, 26 31 C26 25, 30 22, 32 16 Z" fill="#D49A3D"/>
    <path d="M32 22 C33 26, 35 28, 35 31 C35 33.2 33.7 34.5 32 34.5 C30.3 34.5, 29 33.2, 29 31 C29 28, 31 26, 32 22 Z" fill="#FAF7F2"/>
    
    <!-- Base Diya / Traditional Vessel -->
    <path d="M20 38 Q32 44 44 38 Q41 46 32 46 Q23 46 20 38 Z" fill="#C97A2B" stroke="#FAF7F2" stroke-width="0.6"/>
    <rect x="29" y="46" width="6" height="3" rx="1.5" fill="#C97A2B"/>
    
    <!-- Traditional Stars/Dots -->
    <circle cx="15" cy="32" r="1.5" fill="#D49A3D"/>
    <circle cx="49" cy="32" r="1.5" fill="#D49A3D"/>
  </g>

  <!-- Typography: Brand Name English + Devanagari Marathi -->
  <g transform="translate(82, 0)">
    <!-- Main English Brand -->
    <text x="0" y="34" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700" fill="#9E2A2B" letter-spacing="-0.3">Sainath Khanawal</text>
    
    <!-- Marathi Script & Location Subtitle -->
    <text x="1" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#C97A2B" letter-spacing="0.4">साईनाथ खानावळ • सदाशिव पेठ, पुणे</text>
    
    <!-- Authentic Sub-badge -->
    <text x="1" y="66" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#61564F" letter-spacing="0.8">AUTHENTIC MAHARASHTRIAN THALIS</text>
  </g>
</svg>
